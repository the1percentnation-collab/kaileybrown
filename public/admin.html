<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-REPLACE_WITH_GA4_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-REPLACE_WITH_GA4_ID");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console | Kailey Brown Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="console-shell">
    <div class="console-topbar">
      <div class="console-topbar-left">
        <a class="console-brand" href="/dashboard.html" aria-label="Kailey Brown Academy">
          <img src="/assets/academy-logo.png" alt="" class="console-brand-mark">

        </a>
        <a class="back-to-main" href="https://kaileybrown.com">&larr; Main Site</a>
      </div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="console-body">
      <div id="gate-msg"></div>
      <div id="panel" style="display:none;">
        <div class="card">
          <h2>Manage your store</h2>
          <p style="font-size:13px; color:var(--gray-light); margin-bottom:14px;">
            Edit courses, set prices and discounts, control what's live, and run your affiliate program.
          </p>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a class="btn btn-primary" href="/manage-courses.html">Manage Courses &amp; Pricing →</a>
            <a class="btn btn-ghost" href="/manage-affiliates.html">Affiliate Program →</a>
          </div>
        </div>

        <div class="card">
          <h2 id="company-name">Company</h2>
          <div id="company-meta" style="font-size:12px; color:var(--gray-light); margin-bottom:12px;"></div>
          <div id="seat-stats" style="display:flex; gap:24px; font-family:var(--font-mono); font-size:12px;"></div>
        </div>

        <div class="card">
          <h2>Invite an employee</h2>
          <form class="inline-form" id="invite-form">
            <div class="field">
              <label for="invite-email">Email</label>
              <input id="invite-email" type="email" required />
            </div>
            <button class="btn btn-primary" type="submit">Generate invite</button>
          </form>
          <div id="invite-result"></div>
        </div>

        <div class="card">
          <h2>Roster</h2>
          <div id="roster-msg" style="font-size:12px; color:var(--gray-light); margin-bottom:10px;"></div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Progress</th>
                <th>Done</th>
                <th>Last active</th>
                <th>Capstone</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="roster-body"></tbody>
          </table>
        </div>

        <div class="card">
          <h2>Pending invites</h2>
          <table class="data-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Code</th>
                <th>Status</th>
                <th>Link</th>
              </tr>
            </thead>
            <tbody id="invites-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
