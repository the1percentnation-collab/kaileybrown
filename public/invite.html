<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1Z4PKNDLHG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-1Z4PKNDLHG");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept invite | Kailey Brown Academy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="https://kaileybrown.com" aria-label="Kailey Brown">
        <img src="/assets/academy-logo.svg" alt="" class="auth-brand-mark">

      </a>
      <div class="brand-badge">Member Portal</div>
      <h1>ACCEPT <span>INVITE</span></h1>
      <div class="auth-sub" id="sub">Preparing your invite…</div>

      <div id="auth-msg"></div>

      <div id="code-display" class="invite-code" style="display:none;"></div>

      <div id="actions" style="display:none;">
        <a class="btn btn-primary" id="btn-signup" href="#" style="display:inline-block; width:100%; text-align:center; text-decoration:none;">Create account &amp; join</a>
        <div style="height:10px;"></div>
        <a class="btn btn-ghost" id="btn-login" href="#" style="display:inline-block; width:100%; text-align:center; text-decoration:none;">I already have an account</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { onAuthReady, acceptInvite } from './js/auth.js';
    import { firebaseReady } from './js/firebase.js';

    const $ = (id) => document.getElementById(id);
    const msg = $('auth-msg');
    function showErr(txt) { msg.innerHTML = `<div class="auth-error">${txt}</div>`; }
    function showOk(txt) { msg.innerHTML = `<div class="auth-ok">${txt}</div>`; }

    const params = new URLSearchParams(location.search);
    const code = (params.get('code') || '').trim();

    if (!code) {
      $('sub').textContent = 'No invite code was provided in the link.';
      showErr('The link you followed is missing ?code=XXX.');
    } else {
      $('code-display').style.display = 'block';
      $('code-display').textContent = code;
      $('sub').textContent = 'Accept your invite to join the company workspace.';
      $('btn-signup').href = `/signup.html?code=${encodeURIComponent(code)}`;
      $('btn-login').href = `/login.html?next=${encodeURIComponent('/invite.html?code=' + code)}`;
      $('actions').style.display = 'block';
    }

    if (!firebaseReady) {
      showErr('Authentication service is unreachable. Check your connection and retry.');
    } else if (code) {
      // If already signed in, accept right now.
      onAuthReady(async (u) => {
        if (!u) return;
        try {
          const res = await acceptInvite(code);
          showOk('Invite accepted. Redirecting to your dashboard…');
          setTimeout(() => location.replace('/index.html'), 1200);
        } catch (err) {
          showErr(err.message || 'Could not accept invite.');
        }
      });
    }
  </script>
</body>
</html>
