<!DOCTYPE html>
<!-- login page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-REPLACE_WITH_GA4_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-REPLACE_WITH_GA4_ID");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Kailey Brown Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.static.com" crossorgin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* "Sign up for free" prompt that points at the Create an account link */
    .signup-anchor { position: relative; display: inline-block; }
    .signup-tip {
      position: absolute;
      right: calc(100% + 32px);
      top: 50%;
      width: 280px;
      max-width: 80vw;
      box-sizing: border-box;
      text-align: left;
      background: var(--red, #C8102E);
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      border: 2px solid #fff;
      box-shadow: 0 18px 50px rgba(200, 16, 46, 0.5), 0 8px 20px rgba(0,0,0,0.55);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(12px) scale(0.94);
      transform-origin: right center;
      transition: opacity .35s ease, transform .35s cubic-bezier(.2,.8,.3,1.3);
      z-index: 1000;
      cursor: pointer;
    }
    .signup-tip.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) translateX(0) scale(1);
      animation: signupTipPulse 1.7s ease-in-out 0.5s infinite;
    }
    /* Marker on the box's right edge, almost touching Create an account */
    .signup-tip-arrow {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      width: 0; height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 16px solid #fff;
      filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.35));
    }
    .signup-tip-arrow::after {
      content: '';
      position: absolute;
      top: -10px;
      left: -16px;
      width: 0; height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 12px solid var(--red, #C8102E);
    }
    .signup-tip-title {
      display: block;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.2px;
    }
    .signup-tip-text {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
      opacity: 0.96;
    }
    .signup-tip-text strong { font-weight: 800; text-decoration: underline; }
    .signup-tip-close {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.08);
      border: 0;
      color: var(--ink-strong);
      font-size: 20px;
      line-height: 1;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.9;
      transition: background .15s ease, opacity .15s ease, transform .15s ease;
    }
    .signup-tip-close:hover { background: rgba(0,0,0,0.4); opacity: 1; transform: scale(1.08); }
    /* Keep attention on the link itself while the tip is up */
    #link-signup.signup-pulse {
      color: var(--red, #C8102E);
      font-weight: 700;
      text-shadow: 0 0 14px var(--red-glow, rgba(200, 16, 46,0.6));
    }
    @keyframes signupTipPulse {
      0%, 100% { box-shadow: 0 18px 50px rgba(200, 16, 46,0.5), 0 0 0 0 rgba(200, 16, 46,0.55); }
      50%      { box-shadow: 0 18px 50px rgba(200, 16, 46,0.65), 0 0 0 10px rgba(200, 16, 46,0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signup-tip { transition: opacity .35s ease; transform: translateY(-50%); }
      .signup-tip.show { animation: none; transform: translateY(-50%); }
    }
  </style>
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="https://kaileybrown.com" aria-label="Kailey Brown">
        <img src="/assets/academy-logo.png" alt="" class="auth-brand-mark">

      </a>
      <div class="brand-badge">Member Portal</div>
      <h1>SIGN <span>IN</span></h1>
      <div class="auth-sub">Welcome back. Continue your journey.</div>

      <div id="auth-msg"></div>

      <form class="auth-form" id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button class="btn btn-primary" type="submit" id="btn-submit">Sign in</button>
        <button class="btn btn-google" type="button" id="btn-google">Continue with Google</button>
      </form>

      <div class="auth-footer">
        <span class="signup-anchor">
          <a href="/signup.html" id="link-signup">Create an account</a>
          <span class="signup-tip" id="signup-tip" role="dialog" aria-label="Sign up for free">
            <button type="button" class="signup-tip-close" id="signup-tip-close" aria-label="Close">&times;</button>
            <span class="signup-tip-title">Not a member?</span>
            <span class="signup-tip-text">Sign up <strong>free</strong> and start your journey &rarr;</span>
            <span class="signup-tip-arrow"></span>
          </span>
        </span>
        <a href="#" id="link-forgot">Forgot password?</a>
      </div>
      <div class="auth-back">
        <a class="back-to-main" href="https://kaileybrown.com">← Back to Main Site</a>
      </div>
    </div>
  </div>

  <!-- Standalone (non-module) so it runs even if Firebase/module imports fail. -->
  <script>
    (function signupNudge() {
      function start() {
        var tip = document.getElementById('signup-tip');
        var link = document.getElementById('link-signup');
        var closeBtn = document.getElementById('signup-tip-close');
        if (!tip || !link) return;
        var dismissed = false;
        function hide() {
          dismissed = true;
          tip.classList.remove('show');
          link.classList.remove('signup-pulse');
        }
        // Appear after 3s and stay until the user closes it with the X.
        setTimeout(function () {
          if (dismissed) return;
          tip.classList.add('show');
          link.classList.add('signup-pulse');
        }, 3000);
        // X closes the box (and only the X) — no auto-dismiss.
        if (closeBtn) {
          closeBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            hide();
          });
        }
        // Clicking the box itself heads to sign up.
        tip.addEventListener('click', function () { window.location.href = '/signup.html'; });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
  </script>

  <script type="module">
    import { loginEmail, loginGoogle, resetPassword, onAuthReady, signOut } from './js/auth.js';
    import { firebaseReady } from './js/firebase.js';
    import { expiredReason } from './js/session.js';

    const $ = (id) => document.getElementById(id);
    const msg = $('auth-msg');

    function showErr(txt) { msg.innerHTML = `<div class="auth-error">${txt}</div>`; }
    function showOk(txt) { msg.innerHTML = `<div class="auth-ok">${txt}</div>`; }
    function clearMsg() { msg.innerHTML = ''; }

    function nextUrl() {
      const p = new URLSearchParams(location.search);
      const n = p.get('next');
      return n && n.startsWith('/') ? n : '/dashboard';
    }

    if (!firebaseReady) {
      showErr('Authentication service is unreachable. Check your connection and retry.');
    }

    // If already signed in, bounce to next — unless the session has already
    // exceeded its idle/absolute limit, in which case end it here silently and
    // require a real sign-in instead of resuming.
    onAuthReady(async (u) => {
      if (!u) return;
      if (expiredReason(u)) {
        try { await signOut(); } catch (e) { /* ignore */ }
        return;
      }
      location.replace(nextUrl());
    });

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg();
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) return showErr('Email and password required.');
      $('btn-submit').disabled = true;
      try {
        await loginEmail(email, password);
        location.replace(nextUrl());
      } catch (err) {
        showErr(err.message || 'Sign-in failed.');
      } finally {
        $('btn-submit').disabled = false;
      }
    });

    $('btn-google').addEventListener('click', async () => {
      clearMsg();
      try {
        await loginGoogle();
        location.replace(nextUrl());
      } catch (err) {
        showErr(err.message || 'Google sign-in failed.');
      }
    });

    $('link-forgot').addEventListener('click', async (e) => {
      e.preventDefault();
      clearMsg();
      const email = $('email').value.trim();
      if (!email) return showErr('Enter your email first, then click Forgot password.');
      try {
        await resetPassword(email);
        showOk('Password reset email sent. Check your inbox.');
      } catch (err) {
        showErr(err.message || 'Could not send reset email.');
      }
    });
  </script>
<script src="/js/consent-banner.js" defer></script>
</body>
</html>
