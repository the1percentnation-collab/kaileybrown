<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-REPLACE_WITH_GA4_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-REPLACE_WITH_GA4_ID");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | Kailey Brown Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="https://kaileybrown.com" aria-label="Kailey Brown">
        <img src="/assets/academy-logo.png" alt="" class="auth-brand-mark">

      </a>
      <div class="brand-badge">Member Portal</div>
      <h1>CREATE <span>ACCOUNT</span></h1>
      <div class="auth-sub">Start your Academy journey.</div>

      <div id="auth-msg"></div>

      <form class="auth-form" id="signup-form" novalidate>
        <label for="displayName">Full name</label>
        <input id="displayName" type="text" autocomplete="name" required />

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password (8+ characters)</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />

        <label for="inviteCode">Invite code (optional)</label>
        <input id="inviteCode" type="text" autocomplete="one-time-code" placeholder="From your company admin" />

        <button class="btn btn-primary" type="submit" id="btn-submit">Create account</button>
        <button class="btn btn-google" type="button" id="btn-google">Continue with Google</button>
      </form>

      <div class="auth-footer">
        <a href="/login.html">I already have an account</a>
      </div>
      <div class="auth-back">
        <a class="back-to-main" href="https://kaileybrown.com">← Back to Main Site</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { signupEmail, loginGoogle, acceptInvite, acceptCommunityInvite, onAuthReady } from './js/auth.js';
    import { firebaseReady } from './js/firebase.js';

    const $ = (id) => document.getElementById(id);
    const msg = $('auth-msg');
    function showErr(txt) { msg.innerHTML = `<div class="auth-error">${txt}</div>`; }
    function showOk(txt) { msg.innerHTML = `<div class="auth-ok">${txt}</div>`; }
    function clearMsg() { msg.innerHTML = ''; }

    // Pre-fill invite code from ?code=
    const params = new URLSearchParams(location.search);
    const preCode = params.get('code');
    if (preCode) $('inviteCode').value = preCode;

    // Community invite token (?invite=) — surface a brief banner so the
    // user knows they're joining via someone's link, then quietly attach
    // it to the signup call so the server records the use.
    const communityInviteToken = params.get('invite') || null;
    if (communityInviteToken) {
      showOk('You\'ve been invited to Kailey Brown Academy. Create your account to accept.');
    }

    if (!firebaseReady) {
      showErr('Authentication service is unreachable. Check your connection and retry.');
    }

    $('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg();
      const displayName = $('displayName').value.trim();
      const email = $('email').value.trim();
      const password = $('password').value;
      const inviteCode = $('inviteCode').value.trim() || null;

      if (!email || !password || password.length < 8) {
        return showErr('Enter a valid email and password (8+ characters).');
      }
      $('btn-submit').disabled = true;
      try {
        await signupEmail({ email, password, displayName, inviteCode, communityInviteToken });
        location.replace('/onboarding');
      } catch (err) {
        showErr(err.message || 'Sign-up failed.');
      } finally {
        $('btn-submit').disabled = false;
      }
    });

    $('btn-google').addEventListener('click', async () => {
      clearMsg();
      try {
        await loginGoogle();
        const code = $('inviteCode').value.trim();
        if (code) {
          try { await acceptInvite(code); } catch (err) { showErr('Signed in but invite failed: ' + (err.message || err)); return; }
        }
        if (communityInviteToken) {
          try { await acceptCommunityInvite(communityInviteToken); } catch (err) { /* tolerated */ }
        }
        location.replace('/onboarding');
      } catch (err) {
        showErr(err.message || 'Google sign-in failed.');
      }
    });
  </script>
<script src="/js/consent-banner.js" defer></script>
</body>
</html>
