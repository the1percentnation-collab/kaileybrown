name: Deploy Firestore rules + Storage rules + Cloud Functions
on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'functions/**'
      - '.github/workflows/firebase-deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write service account key
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAILEY_BROWN }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_KAILEY_BROWN is missing or empty."
            echo "::error::Set it at Settings > Secrets and variables > Actions > New repository secret."
            echo "::error::The name must match exactly, and it must be a REPOSITORY secret (an environment secret is not visible here)."
            exit 1
          fi
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "path=$RUNNER_TEMP/sa.json" >> "$GITHUB_OUTPUT"
          echo "SA client_email: $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["client_email"])' "$RUNNER_TEMP/sa.json")"

      # Rules deploy FIRST, and on its own.
      #
      # These two deploys have different requirements: rules and indexes need
      # no billing, while a functions deploy reads Secret Manager, which does.
      # They used to run as a single `firebase deploy` command, so when billing
      # lapsed the whole command aborted on the secrets lookup and the rules —
      # already compiled and valid — were never pushed. Security rules silently
      # stopped deploying for weeks while the workflow reported the failure as
      # "functions".
      #
      # Rules also go before `npm install` so a dependency problem in
      # functions/ can't block a security-rule change either.
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:rules \
            --project kaileybrown-48e22 \
            --non-interactive \
            --force

      # Indexes are their own step, and a failure here does not stop the job.
      #
      # Rules and indexes used to share one command. The deploy service account
      # can publish rules but lacked permission to manage indexes, so every run
      # died on
      #
      #     403, The caller does not have permission
      #     (.../collectionGroups/posts/indexes)
      #
      # and because the command is all-or-nothing, the rules were never
      # released and the functions step behind it never ran. Nothing in the
      # backend deployed for months on account of one missing role.
      #
      # continue-on-error lets the functions and Storage steps run regardless;
      # the last step of the job turns the run red again if this one failed,
      # so a missing index is still loud, it just no longer holds the rest
      # hostage.
      - name: Deploy Firestore indexes
        id: indexes
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:indexes \
            --project kaileybrown-48e22 \
            --non-interactive \
            --force


      - name: Install function deps
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
        run: |
          npx --yes firebase-tools deploy \
            --only functions \
            --project kaileybrown-48e22 \
            --non-interactive \
            --force \
          || {
            echo "::error::Cloud Functions deploy failed. Firestore rules in the earlier step DID deploy. 'Permissions denied enabling <name>.googleapis.com' means that Google Cloud API is switched off for kaileybrown-48e22 and a project owner has to enable it in the console (APIs & Services > Library). Functions v2 also require the Blaze plan — a 403 mentioning 'requires billing to be enabled' on secretmanager.googleapis.com means billing is off for kaileybrown-48e22. See AUTH_SETUP.md step 1."
            exit 1
          }

      # Storage is separate from Firestore for the same reason functions are
      # separate from rules: the storage deploy needs the default bucket to
      # exist and the firebasestorage.defaultBucket.get permission, and when
      # either is missing it must not block the Firestore rules or the
      # functions — which is exactly what happened on the first production
      # deploy attempt. Last on purpose: nothing depends on it.
      - name: Deploy Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
        run: |
          npx --yes firebase-tools deploy \
            --only storage \
            --project kaileybrown-48e22 \
            --non-interactive \
            --force \
          || {
            echo "::error::Storage rules deploy failed. Firestore rules and Cloud Functions before this step DID deploy. A 403 on firebasestorage.defaultBucket.get means either the default Storage bucket has not been created (Firebase console > Build > Storage > Get started) or the deploy service account lacks the Firebase Storage Admin role."
            exit 1
          }

      # Keeps an index failure visible. Runs even if a step above failed, so
      # the cause is always named at the bottom of the log.
      - name: Fail the run if indexes did not deploy
        if: always() && steps.indexes.outcome == 'failure'
        run: |
          echo "::error::Firestore indexes did NOT deploy. Queries that need a composite index will fail at runtime until they do."
          echo "::error::A 403 'The caller does not have permission' means the deploy service account lacks the Cloud Datastore Index Admin role (roles/datastore.indexAdmin). Grant it in Google Cloud Console > IAM, then re-run this workflow."
          exit 1
